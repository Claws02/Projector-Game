<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Living Stories</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
        cursor: none;
        font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      }
      #stage {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* Hidden source video — tracking reads from it, players never see it. */
      #source {
        position: absolute;
        width: 2px;
        height: 2px;
        opacity: 0;
        pointer-events: none;
      }
      /* Themed "walk up" overlay. Browsers require a gesture before we may
         open the camera, so this doubles as the magic invitation. */
      #invite {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        background: radial-gradient(circle at 50% 60%, #16223a 0%, #05060a 75%);
        color: #cfe7d8;
        text-align: center;
        cursor: pointer;
        transition: opacity 0.8s ease;
      }
      #invite.gone {
        opacity: 0;
        pointer-events: none;
      }
      #invite h1 {
        font-weight: 300;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: clamp(1.4rem, 4vw, 3rem);
        margin: 0;
        text-shadow: 0 0 24px rgba(120, 220, 170, 0.4);
      }
      #invite p {
        font-weight: 300;
        letter-spacing: 0.06em;
        opacity: 0.7;
        margin: 0;
        font-size: clamp(0.8rem, 1.6vw, 1.1rem);
      }
      #invite .pulse {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #8ff0bd;
        box-shadow: 0 0 30px 8px rgba(120, 240, 180, 0.6);
        animation: pulse 2.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(0.7); opacity: 0.5; }
        50% { transform: scale(1.3); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <video id="source" playsinline muted></video>

    <div id="invite">
      <div class="pulse"></div>
      <h1>The Forest Is Sleeping</h1>
      <p>Step closer to wake it</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
