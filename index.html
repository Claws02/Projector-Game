<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b2622">
  <title>Shadow Wall</title>
  <style>
    :root {
      --wall: #efe6d8;
      --ink: #181411;
      --dim: #2b2622;
      --accent: #1f8a8a;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--dim);
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #cam { display: none; }
    #overlay {
      position: fixed; inset: 0;
      display: grid; place-content: center; gap: 16px;
      padding: 24px; text-align: center;
      background: var(--dim); color: var(--wall);
    }
    #overlay[hidden] { display: none; }
    #overlay h1 { margin: 0; font-size: clamp(32px, 9vw, 64px); letter-spacing: 0.02em; }
    #overlay p { margin: 0 auto; max-width: 30em; line-height: 1.5; opacity: 0.8; }
    #start {
      justify-self: center;
      font: 700 20px/1 inherit;
      padding: 18px 40px;
      border: 0; border-radius: 999px;
      background: var(--wall); color: var(--ink);
      cursor: pointer;
    }
    #start:disabled { opacity: 0.5; }
    #status { min-height: 1.5em; font-size: 15px; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <video id="cam" playsinline muted></video>
  <div id="overlay">
    <h1>Shadow Wall</h1>
    <p>Prop the phone up, step back until your whole body is in view, and touch the shadow orbs.
       Gold orbs need both players. The game starts when someone steps in.</p>
    <button id="start" type="button">Start</button>
    <p id="status"></p>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
